    <link rel="preload" as="image" href="/brand/logo-384.webp" type="image/webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
      <style>
      html,body{background:#0D0D0D;margin:0}
      #boot{position:fixed;inset:0;z-index:199;display:flex;align-items:center;justify-content:center;background:#0D0D0D}
      #boot .b{position:relative;width:176px;height:176px}
      #boot .g{position:absolute;inset:-24px;border-radius:50%;background:radial-gradient(circle,rgba(230,57,70,.28),rgba(230,57,70,0) 68%)}
      #boot svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);animation:bs 1.5s linear infinite}
      #boot img{position:absolute;inset:12px;width:152px;height:152px;border-radius:50%;object-fit:cover}
      @keyframes bs{to{transform:rotate(180deg)}}
      .no-boot #boot{display:none}
    </style>
    <script>
      /* Decide before first paint: skip the boot screen on repeat visits in this tab and on /admin (which has its own loader). */
      try{if(sessionStorage.getItem("vareon-splash-seen")==="1"||location.pathname.indexOf("/admin")===0)document.documentElement.className="no-boot"}catch(e){}
    </script>
  </head>
  <body class="bg-ink text-white">
    <div id="boot" aria-hidden="true">
      <div class="b">
        <div class="g"></div>
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="none" stroke="rgba(255,255,255,.08)" stroke-width=".8"/><circle cx="50" cy="50" r="48" fill="none" stroke="#E63946" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="90 211.6"/></svg>
        <img src="/brand/logo-384.webp" width="152" height="152" alt="" decoding="sync" fetchpriority="high" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
